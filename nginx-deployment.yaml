apiVersion: apps/v1
kind: Deployment
metadata:
  name: rger-nginx-deployment
  namespace: rger-eks-activity
spec:
  replicas: 2
  selector:
    matchLabels:
      app: nginx
  template:
    metadata:
      labels:
        app: nginx
    spec:
      serviceAccountName: rger-nginx-service-account
      containers:
       - name: nginx
         image: nginx:latest
         ports: 
         - containerPort: 80
         resources:
           requests:
             memory: "64Mi"
             cpu: "250m"
           limits:
             memory: "128Mi"
             cpu: "500m"

